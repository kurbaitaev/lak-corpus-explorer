<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="wf.meta.title">Corpus occurrence search · Lak Corpus Explorer</title>
<meta name="description" content="Search Lak and Russian forms and inspect readable occurrences in context.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/app.css?v=4">
</head>
<body>
<nav class="nav" aria-label="Primary navigation" data-i18n-aria="nav.primaryLabel">
  <div class="container nav-inner">
    <a class="nav-brand" href="/"><span data-i18n="nav.brand.name">Lak Corpus</span> <span data-i18n="nav.brand.explorer">Explorer</span></a>
    <div class="nav-links" id="nav-links">
      <a class="nav-link" href="/" data-i18n="nav.search">Search</a>
      <a class="nav-link" href="/source-library.html" data-i18n="nav.sourceLibrary">Sources</a>
      <a class="nav-link" href="/observatory.html" data-i18n="nav.observatory">Observatory</a>
      <a class="nav-link" href="/lab.html" data-i18n="nav.lab">Translation Lab</a>
      <a class="nav-link" href="/validate.html" data-i18n="nav.validate">Validate</a>
      <a class="nav-link" href="/leaderboard.html" data-i18n="nav.leaderboard">Leaderboard</a>
      <a class="nav-link" href="/about.html" data-i18n="nav.about">About &amp; Research</a>
      <a class="nav-link" href="/queue.html" data-i18n="nav.queue">Review Queue</a>
      <a class="nav-link" id="auth-link" href="/login.html" data-i18n="nav.login">Log in</a>
    </div>
  </div>
</nav>
<main class="observatory">
  <header class="obs-hero">
    <div class="container">
      <h1 data-i18n="wf.h1">Corpus occurrence search</h1>
      <p data-i18n-html="wf.intro">Find a Lak or Russian form and see where it occurs.</p>
    </div>
  </header>

  <section class="obs-main" aria-label="Corpus occurrence search" data-i18n-aria="wf.indexLabel">
    <div class="container">
      <div id="wf-detail" hidden aria-live="polite"></div>
      <div id="wf-browse">
      <div class="obs-toolbar">
        <div class="obs-controls">
          <div class="field-wrap"><label for="wf-search" data-i18n="wf.searchLabel">Find a form</label><input id="wf-search" type="search" placeholder="Enter a Lak or Russian word…" data-i18n-placeholder="wf.searchPlaceholder" autocomplete="off"></div>
          <div class="field-wrap"><label for="wf-script" data-i18n="wf.script">Script</label><div class="select-wrap"><select id="wf-script"><option value="" data-i18n="wf.script.all">Any script</option></select></div></div>
          <div class="field-wrap"><label for="wf-sort" data-i18n="wf.sort">Order by</label><div class="select-wrap"><select id="wf-sort"><option value="sources" data-i18n="wf.sort.sources">Most files</option><option value="occurrences" data-i18n="wf.sort.occurrences">Most occurrences</option><option value="alphabetical" data-i18n="wf.sort.alphabetical">Alphabetical</option></select></div></div>
        </div>
        <div class="obs-viewbar">
          <label class="wf-marker-toggle"><input type="checkbox" id="wf-marker"> <span data-i18n="wf.markerOnly">Only forms with Lak-specific letters</span></label>
          <div class="obs-result-count" id="wf-results" role="status" aria-live="polite"></div>
        </div>
      </div>

      <div id="wf-content" aria-live="polite" aria-busy="true">
        <div class="obs-grid" aria-label="Loading word forms" data-i18n-aria="wf.loading"><div class="obs-skeleton"></div><div class="obs-skeleton"></div></div>
      </div>
      <nav class="lib-pager" id="wf-pager" aria-label="Index pages" data-i18n-aria="wf.pagerLabel" hidden></nav>
      </div>
    </div>
  </section>
</main>
<script src="/js/i18n.js?v=2"></script>
<script src="/js/nav.js?v=4"></script>
<script src="/js/auth.js?v=2"></script>
<script src="/js/word-forms.js?v=4"></script>
</body>
</html>
